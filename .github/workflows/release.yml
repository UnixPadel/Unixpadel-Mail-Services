name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag / Version (örn: v5.2.0)'
        required: true
        default: 'v5.2.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          cd "mail system unic"
          pyinstaller --noconfirm "UnixPadel Mail Services.spec"

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          name: UnixPadel Mail Services ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            mail system unic/dist/UnixPadel Mail Services.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
